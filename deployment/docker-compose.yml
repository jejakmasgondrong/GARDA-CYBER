# Docker Compose untuk DEVELOPMENT LOKAL.
# Tidak membuka port publik, tidak menjalankan deployment otomatis ke VPS mana pun.
# Konfigurasi production (domain, HTTPS, reverse proxy) disiapkan terpisah — lihat README.md di folder ini.

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    env_file:
      - ../backend/blueteam.env # FILE BLUE TIME DI BACKEND
    ports:
      - "8000:8000"
    volumes:
      # Volume bernama (persistent) — database TIDAK hilang saat container dibuat ulang.
      - garda_cyber_db:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/garda_cyber.db

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

#N8N SERVICES MASUK DISINI 
 
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: kiong
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=profession-naples-leonard-had.trycloudflare.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL= https://revision-medical-concentration-cemetery.trycloudflare.com/
      - GENERIC_TIMEZONE=Asia/Makassar
    volumes:
      - n8n_data:/home/node/.n8n
      
      # WAHA WHATSAAP MASUK SINI 

    extra_hosts:
      - "host.docker.internal:host-gateway"  

volumes:
  garda_cyber_db:
  n8n_data: