<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - GARDA CYBER</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #020617; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #0f172a; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border: 1px solid #1e293b; }
        .logo { text-align: center; font-size: 24px; font-weight: bold; color: #3b82f6; margin-bottom: 30px; letter-spacing: 2px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 12px; background: #020617; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { width: 100%; padding: 14px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #2563eb; }
        #status { text-align: center; margin-top: 15px; font-size: 14px; color: #ef4444; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🛡️ ADMIN GARDA</div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="email" placeholder="admin@garda.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Masuk Ruang Kendali</button>
            <div id="status"></div>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const status = document.getElementById('status');

            // VALIDASI ADMIN (GANTI DENGAN EMAIL & PASSWORD RAHASIAMU)
            if (email === "admin@garda.com" && password === "rahasia123") {
                status.style.color = "#22c55e";
                status.innerText = "Akses diterima. Mengalihkan...";
                
                // Simpan sesi admin
                localStorage.setItem('isAdmin', 'true');
                
                // Redirect ke Dashboard React
                window.location.href = "/static/index.html";
            } else {
                status.style.color = "#ef4444";
                status.innerText = "❌ Akses Ditolak. Kredensial salah.";
            }
        }
    </script>
</body>
</html>
